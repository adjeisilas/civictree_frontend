name: CI

# Runs on every pull request and every push to main.
# Make these checks required in GitHub: Settings -> Branches -> Branch protection rules.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking: src is clean, so any new lint problem fails the build
      - name: Lint
        run: npx eslint src --max-warnings 0

      - name: Check types
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Build
        run: npx vite build
        env:
          # Build-time values only; no secrets belong in the frontend
          VITE_API_BASE_URL: https://api.civictreegh.com/api

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails the build on high or critical advisories in shipped dependencies
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Scan for committed secrets
        run: gitleaks detect --redact --no-banner
